<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1100" viewBox="0 0 1700 1100">
<style>
    .jp { font-family: "Noto Sans JP","IPAexGothic","Yu Gothic","Hiragino Sans",sans-serif; fill:#111; }
    .title { font-size: 32px; font-weight: 700; }
    .subtitle { font-size: 16px; font-weight: 500; }
    .label { font-size: 18px; font-weight: 700; }
    .small { font-size: 14px; font-weight: 500; }
    .tiny { font-size: 12px; font-weight: 500; }
    .nodeTitle { font-size: 19px; font-weight: 700; }
    .nodeSub { font-size: 13px; font-weight: 500; }
    .box { fill: white; stroke: #222; stroke-width: 2.4; rx: 16; ry: 16; }
    .soft { fill: #faf8f2; stroke: #333; stroke-width: 2; }
    .ring { fill: none; stroke: #333; stroke-width: 2.4; }
    .thin { fill: none; stroke: #777; stroke-width: 1.3; }
    .arrow { fill: none; stroke: #222; stroke-width: 2.8; marker-end: url(#arrow); }
    .line { fill: none; stroke: #222; stroke-width: 2.0; }
    .dash { fill:none; stroke:#666; stroke-width:1.5; stroke-dasharray:7 5; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#fffdf8"/><text x="850" y="60" text-anchor="middle" class="jp title">9賢人ネットワーク図（研究史対応）</text><text x="850" y="92" text-anchor="middle" class="jp subtitle">研究史を「免疫システムの流れ」に対応させた構造図</text><rect x="35" y="250" width="170" height="100" class="soft" rx="18" ry="18"/><text x="120" y="288" text-anchor="middle" class="jp nodeTitle">① 感知</text><text x="120" y="312" text-anchor="middle" class="jp nodeSub">審良静男</text><text x="120" y="330" text-anchor="middle" class="jp nodeSub">TLR / 自然免疫</text><line x1="207" y1="300" x2="233" y2="300" class="arrow"/><rect x="235" y="250" width="170" height="100" class="soft" rx="18" ry="18"/><text x="320" y="288" text-anchor="middle" class="jp nodeTitle">② 提示</text><text x="320" y="312" text-anchor="middle" class="jp nodeSub">ラルフ・スタインマン</text><text x="320" y="330" text-anchor="middle" class="jp nodeSub">樹状細胞 / 抗原提示</text><line x1="407" y1="300" x2="433" y2="300" class="arrow"/><rect x="435" y="250" width="170" height="100" class="soft" rx="18" ry="18"/><text x="520" y="288" text-anchor="middle" class="jp nodeTitle">③ 開始</text><text x="520" y="312" text-anchor="middle" class="jp nodeSub">北里柴三郎</text><text x="520" y="330" text-anchor="middle" class="jp nodeSub">血清療法 / 抗毒素</text><line x1="607" y1="300" x2="633" y2="300" class="arrow"/><rect x="635" y="250" width="170" height="100" class="soft" rx="18" ry="18"/><text x="720" y="288" text-anchor="middle" class="jp nodeTitle">④ 多様化</text><text x="720" y="312" text-anchor="middle" class="jp nodeSub">利根川進</text><text x="720" y="330" text-anchor="middle" class="jp nodeSub">V(D)J再構成</text><line x1="807" y1="300" x2="833" y2="300" class="arrow"/><rect x="835" y="250" width="170" height="100" class="soft" rx="18" ry="18"/><text x="920" y="288" text-anchor="middle" class="jp nodeTitle">⑤ 通信</text><text x="920" y="312" text-anchor="middle" class="jp nodeSub">岸本忠三</text><text x="920" y="330" text-anchor="middle" class="jp nodeSub">IL-6 / サイトカイン</text><line x1="1007" y1="300" x2="1033" y2="300" class="arrow"/><rect x="1035" y="250" width="170" height="100" class="box" rx="18" ry="18"/><text x="1120" y="288" text-anchor="middle" class="jp nodeTitle">⑥ 攻撃</text><text x="1120" y="312" text-anchor="middle" class="jp nodeSub">（攻撃相）</text><text x="1120" y="330" text-anchor="middle" class="jp nodeSub">抗体・T細胞が実行</text><line x1="1207" y1="300" x2="1233" y2="300" class="arrow"/><rect x="1235" y="250" width="170" height="100" class="soft" rx="18" ry="18"/><text x="1320" y="288" text-anchor="middle" class="jp nodeTitle">⑦ 停止</text><text x="1320" y="312" text-anchor="middle" class="jp nodeSub">本庶佑</text><text x="1320" y="330" text-anchor="middle" class="jp nodeSub">PD-1 / ブレーキ</text><line x1="1407" y1="300" x2="1433" y2="300" class="arrow"/><rect x="1435" y="250" width="170" height="100" class="soft" rx="18" ry="18"/><text x="1520" y="288" text-anchor="middle" class="jp nodeTitle">⑧ 抑制</text><text x="1520" y="312" text-anchor="middle" class="jp nodeSub">坂口志文</text><text x="1520" y="330" text-anchor="middle" class="jp nodeSub">Treg / 自己寛容</text><rect x="790" y="520" width="120" height="90" class="soft" rx="18" ry="18"/><text x="850" y="552" text-anchor="middle" class="jp nodeTitle">⑨ 記憶</text><text x="850" y="576" text-anchor="middle" class="jp nodeSub">エドワード・ジェンナー</text><text x="850" y="594" text-anchor="middle" class="jp nodeSub">ワクチン / 予防免疫</text><line x1="1520" y1="350" x2="1520" y2="565" class="line"/><line x1="1520" y1="565" x2="910" y2="565" class="arrow"/><line x1="790" y1="565" x2="180" y2="565" class="line"/><line x1="180" y1="565" x2="180" y2="350" class="arrow"/><rect x="1250" y="700" width="220" height="110" class="box" rx="18" ry="18"/><text x="1360" y="735" text-anchor="middle" class="jp nodeTitle">例外経路：アレルギー</text><text x="1360" y="760" text-anchor="middle" class="jp nodeSub">石坂公成・照子</text><text x="1360" y="780" text-anchor="middle" class="jp nodeSub">IgE / 即時型過敏反応</text><path d="M 920 350 C 980 500, 1100 630, 1250 700" class="dash" marker-end="url(#arrow)"/><text x="1110" y="575" text-anchor="middle" class="jp small">主循環から分岐する「過剰反応」の枝</text><rect x="120" y="760" width="860" height="210" class="soft" rx="20" ry="20"/><text x="144" y="795" text-anchor="start" class="jp label">この図の読み方</text><text x="144" y="823" text-anchor="start" class="jp small">・横一列は、免疫の標準的な情報処理の流れを示す。</text><text x="144" y="851" text-anchor="start" class="jp small">・スタインマンを加えることで、自然免疫から獲得免疫への橋渡しが見える。</text><text x="144" y="879" text-anchor="start" class="jp small">・ジェンナーを加えることで、最終成果が「記憶」として社会に実装される構図が見える。</text><text x="144" y="907" text-anchor="start" class="jp small">・石坂は主循環の外側で、免疫の暴走という重要な例外系を示す。</text><text x="144" y="935" text-anchor="start" class="jp small">・攻撃相には単独の賢人を置かず、抗体とT細胞の統合作用として表現した。</text><text x="850" y="1045" text-anchor="middle" class="jp small">研究史を年代順ではなく機能順に並べることで、「九賢人」が免疫システムの要所をどのように照らしたかが見える。</text></svg>