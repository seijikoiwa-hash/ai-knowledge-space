<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400">
<style>
    .jp { font-family: "Noto Sans JP","IPAexGothic","Yu Gothic","Hiragino Sans",sans-serif; fill:#111; }
    .title { font-size: 32px; font-weight: 700; }
    .subtitle { font-size: 16px; font-weight: 500; }
    .label { font-size: 18px; font-weight: 700; }
    .small { font-size: 14px; font-weight: 500; }
    .tiny { font-size: 12px; font-weight: 500; }
    .nodeTitle { font-size: 19px; font-weight: 700; }
    .nodeSub { font-size: 13px; font-weight: 500; }
    .box { fill: white; stroke: #222; stroke-width: 2.4; rx: 16; ry: 16; }
    .soft { fill: #faf8f2; stroke: #333; stroke-width: 2; }
    .ring { fill: none; stroke: #333; stroke-width: 2.4; }
    .thin { fill: none; stroke: #777; stroke-width: 1.3; }
    .arrow { fill: none; stroke: #222; stroke-width: 2.8; marker-end: url(#arrow); }
