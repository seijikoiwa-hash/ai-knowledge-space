  </marker>
</defs>
<rect width="100%" height="100%" fill="#fffdf8"/><text x="700" y="70" text-anchor="middle" class="jp title">円形免疫宇宙図（Immune Universe）</text><text x="700" y="102" text-anchor="middle" class="jp subtitle">九賢人を、免疫の感知・提示・開始・多様化・通信・停止・抑制・記憶・例外の各層に対応させた概念図</text><circle cx="700" cy="760" r="150" class="ring"/><circle cx="700" cy="760" r="285" class="ring"/><circle cx="700" cy="760" r="430" class="ring"/><circle cx="700" cy="760" r="560" class="ring"/><circle cx="700" cy="760" r="88" fill="#fff" stroke="#111" stroke-width="3"/><text x="700" y="752" text-anchor="middle" class="jp title" style="font-size:34px;">免疫</text><text x="700" y="784" text-anchor="middle" class="jp small">外敵認識・防御・制御・記憶</text><text x="700" y="636" text-anchor="middle" class="jp label">第1層</text><text x="700" y="654" text-anchor="middle" class="jp tiny">感知と提示</text><text x="700" y="501" text-anchor="middle" class="jp label">第2層</text><text x="700" y="519" text-anchor="middle" class="jp tiny">開始と多様化</text><text x="700" y="356" text-anchor="middle" class="jp label">第3層</text><text x="700" y="374" text-anchor="middle" class="jp tiny">通信と制御</text><text x="700" y="226" text-anchor="middle" class="jp label">第4層</text><text x="700" y="244" text-anchor="middle" class="jp tiny">記憶と例外</text><rect x="701.0660171779821" y="824.0660171779822" width="210" height="84" class="box"/><text x="806.0660171779821" y="856.0660171779822" text-anchor="middle" class="jp nodeTitle">審良静男</text><text x="806.0660171779821" y="878.0660171779822" text-anchor="middle" class="jp nodeSub">自然免疫センサー</text><text x="806.0660171779821" y="896.0660171779822" text-anchor="middle" class="jp nodeSub">TLR・外敵感知</text><line x1="806.0660171779821" y1="866.0660171779822" x2="774.2462120245875" y2="834.2462120245875" class="thin"/><rect x="488.9339828220178" y="824.0660171779821" width="210" height="84" class="box"/><text x="593.9339828220178" y="856.0660171779821" text-anchor="middle" class="jp nodeTitle">ラルフ・スタインマン</text><text x="593.9339828220178" y="878.0660171779821" text-anchor="middle" class="jp nodeSub">抗原提示</text><text x="593.9339828220178" y="896.0660171779821" text-anchor="middle" class="jp nodeSub">樹状細胞・橋渡し</text><line x1="593.9339828220178" y1="866.0660171779821" x2="625.7537879754125" y2="834.2462120245875" class="thin"/><rect x="570.1606133169174" y="1001.9154889561476" width="210" height="84" class="box"/><text x="675.1606133169174" y="1033.9154889561476" text-anchor="middle" class="jp nodeTitle">北里柴三郎</text><text x="675.1606133169174" y="1055.9154889561476" text-anchor="middle" class="jp nodeSub">開始</text><text x="675.1606133169174" y="1073.9154889561476" text-anchor="middle" class="jp nodeSub">血清療法・抗毒素</text><line x1="675.1606133169174" y1="1043.9154889561476" x2="679.082621740562" y2="999.0867275420189" class="thin"/><rect x="311.0845110438525" y="742.8393866830825" width="210" height="84" class="box"/><text x="416.0845110438525" y="774.8393866830825" text-anchor="middle" class="jp nodeTitle">利根川進</text><text x="416.0845110438525" y="796.8393866830825" text-anchor="middle" class="jp nodeSub">多様化</text><text x="416.0845110438525" y="814.8393866830825" text-anchor="middle" class="jp nodeSub">V(D)J再構成</text><line x1="416.0845110438525" y1="784.8393866830825" x2="460.91327245798107" y2="780.9173782594379" class="thin"/><rect x="999.0678269379407" y="570.9313383699624" width="210" height="84" class="box"/><text x="1104.0678269379407" y="602.9313383699624" text-anchor="middle" class="jp nodeTitle">岸本忠三</text><text x="1104.0678269379407" y="624.9313383699624" text-anchor="middle" class="jp nodeSub">通信</text><text x="1104.0678269379407" y="642.9313383699624" text-anchor="middle" class="jp nodeSub">IL-6・サイトカイン</text><line x1="1104.0678269379407" y1="612.9313383699624" x2="1061.7816590025748" y2="628.3222448196175" class="thin"/><rect x="413.2741474514993" y="328.2876515742405" width="210" height="84" class="box"/><text x="518.2741474514993" y="360.2876515742405" text-anchor="middle" class="jp nodeTitle">本庶佑</text><text x="518.2741474514993" y="382.2876515742405" text-anchor="middle" class="jp nodeSub">停止</text><text x="518.2741474514993" y="400.2876515742405" text-anchor="middle" class="jp nodeSub">PD-1・免疫ブレーキ</text><line x1="518.2741474514993" y1="370.2876515742405" x2="537.2919692298308" y2="411.0715019908897" class="thin"/><rect x="222.60907637269133" y="503.0" width="210" height="84" class="box"/><text x="327.60907637269133" y="535.0" text-anchor="middle" class="jp nodeTitle">坂口志文</text><text x="327.60907637269133" y="557.0" text-anchor="middle" class="jp nodeSub">抑制</text><text x="327.60907637269133" y="575.0" text-anchor="middle" class="jp nodeSub">Treg・自己寛容</text><line x1="327.60907637269133" y1="545.0" x2="366.5802195429911" y2="567.5" class="thin"/><rect x="875.0" y="233.02577388071438" width="210" height="84" class="box"/><text x="980.0" y="265.0257738807144" text-anchor="middle" class="jp nodeTitle">エドワード・ジェンナー</text><text x="980.0" y="287.0257738807144" text-anchor="middle" class="jp nodeSub">記憶</text><text x="980.0" y="305.0257738807144" text-anchor="middle" class="jp nodeSub">ワクチン・予防</text><line x1="980.0" y1="275.0257738807144" x2="957.5" y2="313.9969170510141" class="thin"/><rect x="1135.9184627218783" y="862.9386652574116" width="210" height="84" class="box"/><text x="1240.9184627218783" y="894.9386652574116" text-anchor="middle" class="jp nodeTitle">石坂公成・照子</text><text x="1240.9184627218783" y="916.9386652574116" text-anchor="middle" class="jp nodeSub">例外</text><text x="1240.9184627218783" y="934.9386652574116" text-anchor="middle" class="jp nodeSub">IgE・アレルギー</text><line x1="1240.9184627218783" y1="904.9386652574116" x2="1197.4518005388702" y2="893.2918082277981" class="thin"/><text x="700" y="1280" text-anchor="middle" class="jp small">循環の見方：　感知 → 提示 → 開始 → 多様化 → 通信 → 攻撃 → 停止 → 抑制 → 記憶</text><text x="700" y="1310" text-anchor="middle" class="jp small">石坂はこの主循環の外縁で「免疫の過剰反応」という例外領域を照らす</text></svg>