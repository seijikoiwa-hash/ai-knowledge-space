<h2>📚 ブログ記事一覧</h2>

<ul id="post-list"></ul>

<p class="note">
※ 公開済みの記事のみ、新しい順に表示されます。
</p>

<script src="posts.js"></script>

<script>
const list = document.getElementById("post-list");

if (typeof posts === "undefined") {

  list.innerHTML = "<li>posts.js が読み込めていません。</li>";

} else {

  posts
    .filter(p => p.published)
    .sort((a, b) => new Date(b.date) - new Date(a.date))
    .forEach(p => {

      const li = document.createElement("li");

      li.innerHTML = `
        <a href="${p.file}">
          ${p.title}
          <span class="book">-book${p.book}-</span>
        </a>

        <div class="date">${p.date}</div>
      `;

      list.appendChild(li);

    });
}
</script>
