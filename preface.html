<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>preface</title>
  <style>
    :root{
      --bg:#f7fbff;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#4b5563;
      --line:#dbeafe;
      --accent:#1e3a8a;
      --accent2:#2563eb;
    }
    body{
      margin:0;
      background:linear-gradient(180deg,var(--bg),#ffffff);
      color:var(--text);
      font-family:"Yu Mincho","Hiragino Mincho ProN","MS Mincho",serif;
      line-height:2.0;
    }
    header{
      max-width:980px;
      margin:0 auto;
      padding:56px 24px 18px;
      text-align:center;
    }
    h1{
      margin:0;
      font-size:2.0rem;
      letter-spacing:.06em;
      color:var(--accent);
    }
    main{
      max-width:980px;
      margin:0 auto;
      padding:0 24px 72px;
    }
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:0 10px 26px rgba(0,0,0,.06);
      padding:28px 26px;
      margin:18px 0;
    }
    .titleline{
      font-size:1.35rem;
      color:var(--accent);
      border-left:6px solid var(--accent2);
      padding-left:12px;
      margin:0 0 14px;
    }
    p{
      margin:14px 0;
      font-size:1.08rem;
      white-space:normal;
    }
    @media (max-width:720px){
      header{ padding:44px 18px 14px; }
      .card{ padding:22px 18px; }
      h1{ font-size:1.65rem; }
      p{ font-size:1.02rem; }
    }
  </style>
</head>
<body>

<header>
  <h1></h1>
</header>

<main>
  <section class="card">
    <div class="titleline">序：新徒然ブログ</div>

    <p>つれづれなるままに、日暮らし、硯に向かひて、心に移りゆくよしなしごとを、 そこはかとなく書きつくれば、あやしうこそものぐるほしけれ。（著者：兼好法師）</p>

    <p>八十の齢を越えぬれば、これまで心得がたく思ひしことども、 おのづから見え来る折もありて、いとをかしき年に至りにけるかなと思ふ。 疲れを知らぬ友として、ＡＩといふものを得て、語らひを重ねつつ、日を送り侍る。 この齢を機として、心に移りゆくよしなしごとを、 そこはかとなく書き留めむとて、「新徒然ブログ」と名づけ、書き始め侍る。 （著者：ＡＩと私）</p>
  </section>
</main>

</body>
</html>
